<svg xmlns="http://www.w3.org/2000/svg" width="1390" height="1410" viewBox="0 0 1390 1410"><rect width="100%" height="100%" fill="white"/><text x="330.0" y="27.1" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#1e1e1e" font-weight="bold"><tspan x="330.0" dy="0.0">legal_moves()</tspan></text><ellipse cx="330.0" cy="70.0" rx="125.0" ry="19.75" fill="#d8ecd6" stroke="#1e1e1e" stroke-width="1.5"/><text x="330.0" y="74.5" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="330.0" dy="0.0">moves = [ ], me = turn</tspan></text><rect x="210.0" y="130.25" width="240" height="39.5" fill="none" stroke="#1e1e1e" stroke-width="1.5"/><text x="330.0" y="154.6" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="330.0" dy="0.0">next cell frm (0 to 99)</tspan></text><polygon points="330.0,217.5 435.0,250.0 330.0,282.5 225.0,250.0" fill="#fde9d0" stroke="#1e1e1e" stroke-width="1.5"/><text x="330.0" y="254.6" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="330.0" dy="0.0">cells[frm] == me?</tspan></text><rect x="200.0" y="331.5" width="260" height="57.0" fill="none" stroke="#1e1e1e" stroke-width="1.5"/><text x="330.0" y="355.8" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="330.0" dy="0.0">cells[frm] = EMPTY</tspan><tspan x="330.0" dy="17.5">(the amazon is lifted)</tspan></text><rect x="200.0" y="430.25" width="260" height="39.5" fill="none" stroke="#1e1e1e" stroke-width="1.5"/><text x="330.0" y="454.6" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="330.0" dy="0.0">for to in _reachable(frm)</tspan></text><rect x="190.0" y="500.25" width="280" height="39.5" fill="none" stroke="#1e1e1e" stroke-width="1.5"/><text x="330.0" y="524.5" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="330.0" dy="0.0">for arrow in _reachable(to)</tspan></text><rect x="180.0" y="570.25" width="300" height="39.5" fill="none" stroke="#1e1e1e" stroke-width="1.5"/><text x="330.0" y="594.5" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="330.0" dy="0.0">moves.append((frm, to, arrow))</tspan></text><rect x="200.0" y="650.25" width="260" height="39.5" fill="none" stroke="#1e1e1e" stroke-width="1.5"/><text x="330.0" y="674.5" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="330.0" dy="0.0">cells[frm] = me (put back)</tspan></text><polygon points="330.0,727.5 415.0,760.0 330.0,792.5 245.0,760.0" fill="#fde9d0" stroke="#1e1e1e" stroke-width="1.5"/><text x="330.0" y="764.5" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="330.0" dy="0.0">frm == 99?</tspan></text><ellipse cx="330.0" cy="860.0" rx="85.0" ry="19.75" fill="#d8ecd6" stroke="#1e1e1e" stroke-width="1.5"/><text x="330.0" y="864.5" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="330.0" dy="0.0">return moves</tspan></text><polyline points="330.0,89.8 330.0,130.2" fill="none" stroke="#1e1e1e" stroke-width="1.5"/><polygon points="330.0,130.2 325.7,120.1 334.3,120.1" fill="#1e1e1e"/><polyline points="330.0,169.8 330.0,217.5" fill="none" stroke="#1e1e1e" stroke-width="1.5"/><polygon points="330.0,217.5 325.7,207.4 334.3,207.4" fill="#1e1e1e"/><polyline points="330.0,388.5 330.0,430.2" fill="none" stroke="#1e1e1e" stroke-width="1.5"/><polygon points="330.0,430.2 325.7,420.1 334.3,420.1" fill="#1e1e1e"/><polyline points="330.0,469.8 330.0,500.2" fill="none" stroke="#1e1e1e" stroke-width="1.5"/><polygon points="330.0,500.2 325.7,490.1 334.3,490.1" fill="#1e1e1e"/><polyline points="330.0,539.8 330.0,570.2" fill="none" stroke="#1e1e1e" stroke-width="1.5"/><polygon points="330.0,570.2 325.7,560.1 334.3,560.1" fill="#1e1e1e"/><polyline points="330.0,609.8 330.0,650.2" fill="none" stroke="#1e1e1e" stroke-width="1.5"/><polygon points="330.0,650.2 325.7,640.1 334.3,640.1" fill="#1e1e1e"/><polyline points="330.0,689.8 330.0,727.5" fill="none" stroke="#1e1e1e" stroke-width="1.5"/><polygon points="330.0,727.5 325.7,717.4 334.3,717.4" fill="#1e1e1e"/><polyline points="330.0,282.5 330.0,331.5" fill="none" stroke="#1e1e1e" stroke-width="1.5"/><polygon points="330.0,331.5 325.7,321.4 334.3,321.4" fill="#1e1e1e"/><rect x="315.4" y="296.2" width="29.1" height="21.5" fill="white"/><text x="330.0" y="311.6" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="330.0" dy="0.0">yes</tspan></text><polyline points="435.0,250.0 560.0,250.0 560.0,760.0 415.0,760.0" fill="none" stroke="#1e1e1e" stroke-width="1.5"/><polygon points="415.0,760.0 425.1,755.7 425.1,764.3" fill="#1e1e1e"/><rect x="549.3" y="494.2" width="21.4" height="21.5" fill="white"/><text x="560.0" y="509.6" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="560.0" dy="0.0">no</tspan></text><polyline points="330.0,792.5 330.0,840.2" fill="none" stroke="#1e1e1e" stroke-width="1.5"/><polygon points="330.0,840.2 325.7,830.1 334.3,830.1" fill="#1e1e1e"/><rect x="315.4" y="805.6" width="29.1" height="21.5" fill="white"/><text x="330.0" y="820.9" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="330.0" dy="0.0">yes</tspan></text><polyline points="245.0,760.0 90.0,760.0 90.0,150.0 210.0,150.0" fill="none" stroke="#1e1e1e" stroke-width="1.5"/><polygon points="210.0,150.0 199.9,154.3 199.9,145.7" fill="#1e1e1e"/><rect x="79.3" y="444.2" width="21.4" height="21.5" fill="white"/><text x="90.0" y="459.6" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="90.0" dy="0.0">no</tspan></text><rect x="40" y="920" width="480" height="87.0" fill="#fff4cc" stroke="#1e1e1e" stroke-width="1.5"/><text x="52.0" y="943.4" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#1e1e1e"><tspan x="52.0" dy="0.0">_reachable(start): walk each ray in RAYS[start]</tspan><tspan x="52.0" dy="16.2">and stop at the first square that is not EMPTY.</tspan><tspan x="52.0" dy="16.2">Lifting the amazon lets the arrow pass through</tspan><tspan x="52.0" dy="16.2">or land on the square it just left.</tspan></text><text x="870.0" y="27.1" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#1e1e1e" font-weight="bold"><tspan x="870.0" dy="0.0">make(move)</tspan></text><rect x="745.0" y="50.25" width="250" height="39.5" fill="none" stroke="#1e1e1e" stroke-width="1.5"/><text x="870.0" y="74.5" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="870.0" dy="0.0">frm, to, arrow = move</tspan></text><rect x="745.0" y="125.25" width="250" height="39.5" fill="none" stroke="#1e1e1e" stroke-width="1.5"/><text x="870.0" y="149.6" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="870.0" dy="0.0">cells[to] = cells[frm]</tspan></text><polyline points="870.0,89.8 870.0,125.2" fill="none" stroke="#1e1e1e" stroke-width="1.5"/><polygon points="870.0,125.2 865.7,115.1 874.3,115.1" fill="#1e1e1e"/><rect x="745.0" y="200.25" width="250" height="39.5" fill="none" stroke="#1e1e1e" stroke-width="1.5"/><text x="870.0" y="224.6" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="870.0" dy="0.0">cells[frm] = EMPTY</tspan></text><polyline points="870.0,164.8 870.0,200.2" fill="none" stroke="#1e1e1e" stroke-width="1.5"/><polygon points="870.0,200.2 865.7,190.1 874.3,190.1" fill="#1e1e1e"/><rect x="745.0" y="275.25" width="250" height="39.5" fill="none" stroke="#1e1e1e" stroke-width="1.5"/><text x="870.0" y="299.6" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="870.0" dy="0.0">cells[arrow] = ARROW</tspan></text><polyline points="870.0,239.8 870.0,275.2" fill="none" stroke="#1e1e1e" stroke-width="1.5"/><polygon points="870.0,275.2 865.7,265.1 874.3,265.1" fill="#1e1e1e"/><rect x="745.0" y="350.25" width="250" height="39.5" fill="none" stroke="#1e1e1e" stroke-width="1.5"/><text x="870.0" y="374.6" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="870.0" dy="0.0">turn = other player</tspan></text><polyline points="870.0,314.8 870.0,350.2" fill="none" stroke="#1e1e1e" stroke-width="1.5"/><polygon points="870.0,350.2 865.7,340.1 874.3,340.1" fill="#1e1e1e"/><text x="1200.0" y="27.1" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#1e1e1e" font-weight="bold"><tspan x="1200.0" dy="0.0">unmake(move)</tspan></text><rect x="1060.0" y="50.25" width="280" height="39.5" fill="none" stroke="#1e1e1e" stroke-width="1.5"/><text x="1200.0" y="74.5" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="1200.0" dy="0.0">frm, to, arrow = move</tspan></text><rect x="1060.0" y="125.25" width="280" height="39.5" fill="none" stroke="#1e1e1e" stroke-width="1.5"/><text x="1200.0" y="149.6" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="1200.0" dy="0.0">cells[arrow] = EMPTY  (first)</tspan></text><polyline points="1200.0,89.8 1200.0,125.2" fill="none" stroke="#1e1e1e" stroke-width="1.5"/><polygon points="1200.0,125.2 1195.7,115.1 1204.3,115.1" fill="#1e1e1e"/><rect x="1060.0" y="200.25" width="280" height="39.5" fill="none" stroke="#1e1e1e" stroke-width="1.5"/><text x="1200.0" y="224.6" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="1200.0" dy="0.0">cells[frm] = cells[to]</tspan></text><polyline points="1200.0,164.8 1200.0,200.2" fill="none" stroke="#1e1e1e" stroke-width="1.5"/><polygon points="1200.0,200.2 1195.7,190.1 1204.3,190.1" fill="#1e1e1e"/><rect x="1060.0" y="275.25" width="280" height="39.5" fill="none" stroke="#1e1e1e" stroke-width="1.5"/><text x="1200.0" y="299.6" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="1200.0" dy="0.0">cells[to] = EMPTY</tspan></text><polyline points="1200.0,239.8 1200.0,275.2" fill="none" stroke="#1e1e1e" stroke-width="1.5"/><polygon points="1200.0,275.2 1195.7,265.1 1204.3,265.1" fill="#1e1e1e"/><rect x="1060.0" y="350.25" width="280" height="39.5" fill="none" stroke="#1e1e1e" stroke-width="1.5"/><text x="1200.0" y="374.6" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="1200.0" dy="0.0">turn = other player</tspan></text><polyline points="1200.0,314.8 1200.0,350.2" fill="none" stroke="#1e1e1e" stroke-width="1.5"/><polygon points="1200.0,350.2 1195.7,340.1 1204.3,340.1" fill="#1e1e1e"/><rect x="750" y="450" width="600" height="87.0" fill="#fff4cc" stroke="#1e1e1e" stroke-width="1.5"/><text x="762.0" y="473.4" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#1e1e1e"><tspan x="762.0" dy="0.0">Order matters in unmake: the arrow may lie on frm.</tspan><tspan x="762.0" dy="16.2">Clearing it first, then moving the amazon back,</tspan><tspan x="762.0" dy="16.2">restores the exact board. The reverse order</tspan><tspan x="762.0" dy="16.2">would erase the amazon.</tspan></text><rect x="750" y="600" width="600" height="87.0" fill="#fff4cc" stroke="#1e1e1e" stroke-width="1.5"/><text x="762.0" y="623.4" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#1e1e1e"><tspan x="762.0" dy="0.0">is_over(): the player to move has a legal move</tspan><tspan x="762.0" dy="16.2">if and only if one of its amazons has an empty</tspan><tspan x="762.0" dy="16.2">neighbour (step there, shoot back to frm).</tspan><tspan x="762.0" dy="16.2">So at most 32 squares are checked.</tspan></text></svg>