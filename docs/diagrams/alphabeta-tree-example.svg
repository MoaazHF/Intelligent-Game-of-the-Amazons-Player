aves are scores from the evaluation function, read left to right.</tspan><tspan x="52.0" dy="17.5">Second MIN node: after the leaf 2 its value is at most 2, but MAX already has 3 from the first branch.</tspan><tspan x="52.0" dy="17.5">alpha (3) &gt;= beta (2), so leaves 4 and 6 are never searched. The root value is 3, the same as Minimax.</tspan></text></svg>