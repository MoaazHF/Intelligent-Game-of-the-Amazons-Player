<svg xmlns="http://www.w3.org/2000/svg" width="1002" height="1280" viewBox="0 0 1002 1280"><rect width="100%" height="100%" fill="white"/><ellipse cx="400.0" cy="40.0" rx="165.0" ry="19.75" fill="#d8ecd6" stroke="#1e1e1e" stroke-width="1.5"/><text x="400.0" y="44.5" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="400.0" dy="0.0">alphabeta(state, depth, alpha, beta)</tspan></text><rect x="220.0" y="95.25" width="360" height="39.5" fill="none" stroke="#1e1e1e" stroke-width="1.5"/><text x="400.0" y="119.5" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="400.0" dy="0.0">_tick(): count the node, stop if time is up</tspan></text><polygon points="400.0,177.5 490.0,210.0 400.0,242.5 310.0,210.0" fill="#fde9d0" stroke="#1e1e1e" stroke-width="1.5"/><text x="400.0" y="214.6" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="400.0" dy="0.0">depth == 0?</tspan></text><polygon points="780.0,177.5 865.0,210.0 780.0,242.5 695.0,210.0" fill="#fde9d0" stroke="#1e1e1e" stroke-width="1.5"/><text x="780.0" y="214.6" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="780.0" dy="0.0">is_over()?</tspan></text><ellipse cx="780.0" cy="330.0" rx="130.0" ry="19.75" fill="#d8ecd6" stroke="#1e1e1e" stroke-width="1.5"/><text x="780.0" y="334.6" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="780.0" dy="0.0">return evaluate(state, root)</tspan></text><rect x="290.0" y="300.25" width="220" height="39.5" fill="none" stroke="#1e1e1e" stroke-width="1.5"/><text x="400.0" y="324.6" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="400.0" dy="0.0">moves = legal_moves()</tspan></text><polygon points="400.0,382.5 485.0,415.0 400.0,447.5 315.0,415.0" fill="#fde9d0" stroke="#1e1e1e" stroke-width="1.5"/><text x="400.0" y="419.6" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="400.0" dy="0.0">no moves?</tspan></text><ellipse cx="780.0" cy="440.0" rx="165.0" ry="28.5" fill="#d8ecd6" stroke="#1e1e1e" stroke-width="1.5"/><text x="780.0" y="435.8" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="780.0" dy="0.0">return -(WIN + depth) if root to move</tspan><tspan x="780.0" dy="17.5">else WIN + depth</tspan></text><rect x="250.0" y="500.25" width="300" height="39.5" fill="none" stroke="#1e1e1e" stroke-width="1.5"/><text x="400.0" y="524.5" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="400.0" dy="0.0">moves = order_moves(state, moves)</tspan></text><rect x="210.0" y="562.75" width="380" height="74.5" fill="none" stroke="#1e1e1e" stroke-width="1.5"/><text x="400.0" y="587.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="400.0" dy="0.0">next move m:  make(m)</tspan><tspan x="400.0" dy="17.5">v = alphabeta(state, depth - 1, alpha, beta)</tspan><tspan x="400.0" dy="17.5">unmake(m)</tspan></text><rect x="165.0" y="671.5" width="470" height="57.0" fill="none" stroke="#1e1e1e" stroke-width="1.5"/><text x="400.0" y="695.8" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="400.0" dy="0.0">MAX node: best = max(best, v), alpha = max(alpha, best)</tspan><tspan x="400.0" dy="17.5">MIN node: best = min(best, v), beta = min(beta, best)</tspan></text><polygon points="400.0,767.5 500.0,800.0 400.0,832.5 300.0,800.0" fill="#fde9d0" stroke="#1e1e1e" stroke-width="1.5"/><text x="400.0" y="804.5" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="400.0" dy="0.0">alpha &gt;= beta?</tspan></text><polygon points="400.0,887.5 495.0,920.0 400.0,952.5 30